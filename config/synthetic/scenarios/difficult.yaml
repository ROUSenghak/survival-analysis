# Executable required scenario: difficult.
# Overlay on central_provisional. This increases realistic ambiguity and
# reachability loss while keeping the production algorithm configuration fixed.

extends: central_provisional

scenario_id: difficult
display_name: "Difficult"
version: "0.3"
purpose: >
  Harder controlled setting with more identity fragmentation, wording drift,
  generic/repeated text, CPV degradation, and successor timing dispersion.
provenance: "SCENARIO_UNIDENTIFIED"
references:
  - config/synthetic/scenarios/03_buyer_fragmentation.yaml
  - config/synthetic/scenarios/05_semantic_drift.yaml
  - config/synthetic/scenarios/central_provisional.yaml
baseline_reference: moderate.yaml
scenario_design_note: >
  Deliberately imposes stronger recall ceilings and candidate ambiguity than
  moderate. It is a sensitivity/stress scenario, not an empirical estimate of
  BOAMP recurrence or algorithm performance.

recurrence:
  base_recurrence_propensity: 0.32
  cycle_gap_distribution: {type: normal, mean_months: 22.0, sd_months: 12.0, min_months: 1.0}
  scoped_candidate_environment:
    recurrence_propensity_multiplier: 1.15
    near_window_share: 0.55
    hard_negative_alignment_rate: 0.16
    scoped_buyer_affinity_share: 0.10
    scoped_need_probability_high: 0.78

identifiers:
  siret_missing_rate: 0.84
  siren_only_rate: 0.10
  both_missing_rate: 0.86
  invalid_identifier_rate: 0.02
  wrong_establishment_siret_rate: 0.05

buyer_names:
  false_split_rate: 0.38
  false_merge_rate: 0.12
  generic_collision_rate: 0.48

cpv:
  parent_replace_rate: 0.08
  division_only_rate: 0.05
  generic_rate: 0.14
  wrong_related_rate: 0.04

duration:
  rounding_severity: 0.55
  common_admin_value_rate: 0.28
  unit_conversion_failure_rate: 0.035

text:
  next_cycle_drift_severity: 0.72
  hard_negative_overlap_rate: 0.25
  boilerplate_rate: 0.55
  conditional_reuse:
    exact_template_share: 0.88
    near_boilerplate_extra_rate: 0.12
    generic_weak_extra_rate: 0.07

quality_class_mix:
  HIGH: 0.18
  MEDIUM: 0.42
  LOW: 0.40
